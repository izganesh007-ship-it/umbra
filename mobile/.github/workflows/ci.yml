name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: ./umbra/mobile
      
      - name: Analyze
        run: flutter analyze
        working-directory: ./umbra/mobile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: ./umbra/mobile
      
      - name: Run tests
        run: flutter test
        working-directory: ./umbra/mobile

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: ./umbra/mobile
      
      - name: Run integration tests
        run: flutter test integration_test/app_flow_test.dart
        working-directory: ./umbra/mobile

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test, integration-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: ./umbra/mobile
      
      - name: Build APK
        run: flutter build apk --release
        working-directory: ./umbra/mobile

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test, integration-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: ./umbra/mobile
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign
        working-directory: ./umbra/mobile